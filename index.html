<html lang="tr">

<style>
/* Kurumsal görünüm: sistem yazı tipi, lacivert vurgu, nötr gri zemin. Sayfa dışarıya istek atmaz. */
:root{
  --bg:#f3f4f6;
  --surface:#fff;
  --surface-2:#f6f7f9;
  --ink:#1f2328;
  --ink-2:#57606a;
  --ink-3:#8c959f;
  --line:#d8dee4;
  --line-2:#c2c9d1;
  --accent:#1f3b63;
  --accent-ink:#fff;
  --accent-soft:#e9eef5;
  --ok:#1e7a34;
  --ok-soft:#eaf4ec;
  --warn:#9a5b00;
  --warn-soft:#fdf4e3;
  --danger:#b3261e;
  --danger-soft:#fbeceb;
  --info:#1f3b63;
  --info-soft:#eef2f7;
  --f:"Segoe UI",-apple-system,system-ui,Roboto,"Helvetica Neue",Arial,sans-serif;
  --mono:ui-monospace,"Cascadia Mono",Consolas,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#16181c;--surface:#1e2126;--surface-2:#24282e;--ink:#e6e8eb;--ink-2:#a9b0b8;--ink-3:#7b838c;
    --line:#30353c;--line-2:#3e444c;--accent:#9ab8e3;--accent-ink:#101826;--accent-soft:#1d2a3c;
    --ok:#71c387;--ok-soft:#17291c;--warn:#e3a649;--warn-soft:#30250f;--danger:#ef8a80;--danger-soft:#38201e;
    --info:#9ab8e3;--info-soft:#1b2534;color-scheme:dark;
  }
}
/* Belge kâğıdı her temada beyazdır; içindeki bileşenler açık renk değişkenleriyle çizilir. */
.paper,#print{
  --surface:#fff;--surface-2:#f6f7f9;--ink:#1f2328;--ink-2:#57606a;--ink-3:#8c959f;--line:#d8dee4;--line-2:#c2c9d1;
  --accent:#1f3b63;--accent-ink:#fff;--accent-soft:#e9eef5;--warn:#9a5b00;--warn-soft:#fdf4e3;--danger:#b3261e;
  --p-ink:#1f2328;--p-line:#2b3036;--p-soft:#eef0f3;color-scheme:light;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 var(--f)}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--accent);text-underline-offset:2px}
[hidden]{display:none!important}
code{font-family:var(--mono);font-size:.92em;background:var(--surface-2);border:1px solid var(--line);border-radius:4px;padding:0 4px}

input,select,textarea{background:var(--surface);border:1px solid var(--line-2);border-radius:4px;padding:7px 10px;min-height:38px;width:100%;color:var(--ink)}
textarea{resize:vertical;line-height:1.45}
input:focus,select:focus,textarea:focus{outline:2px solid color-mix(in srgb,var(--accent) 40%,transparent);outline-offset:1px;border-color:var(--accent)}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:38px;padding:0 15px;border-radius:4px;border:1px solid var(--line-2);background:var(--surface);color:var(--ink);font-weight:700;font-size:14px;cursor:pointer;white-space:nowrap;text-decoration:none;line-height:1.2}
.btn:hover{background:var(--surface-2)}
.btn:disabled{opacity:.45;cursor:default}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.warn{background:var(--warn-soft);border-color:color-mix(in srgb,var(--warn) 35%,transparent);color:var(--warn)}
.btn.danger{color:var(--danger);border-color:color-mix(in srgb,var(--danger) 40%,transparent)}
.btn.ghost{border-color:transparent;background:transparent}
.btn.ghost:hover{background:var(--surface-2)}
.btn.sm{min-height:31px;padding:0 11px;font-size:13px}
.btn.big{min-height:46px;padding:0 20px;font-size:15.5px}
.link{background:none;border:0;padding:0;color:var(--accent);cursor:pointer;font-weight:700;text-decoration:underline;text-underline-offset:2px}

/* Üst çubuk ve kenar menüsü */
.top{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:12px;height:58px;padding:0 18px;background:var(--surface);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:16.5px;letter-spacing:-.01em;color:var(--ink);text-decoration:none;white-space:nowrap}
.brand svg{flex:none}
.co-sel{width:auto;max-width:320px;min-width:0;font-weight:700}
.top .sp{flex:1}
.userbtn{max-width:240px;overflow:hidden;text-overflow:ellipsis}
.shell{display:grid;grid-template-columns:256px minmax(0,1fr);min-height:calc(100vh - 58px)}
.side{position:sticky;top:58px;height:calc(100vh - 58px);overflow:auto;padding:16px 12px 20px;border-right:1px solid var(--line);background:var(--surface);display:flex;flex-direction:column;gap:2px}
.nv{display:flex;align-items:center;gap:9px;width:100%;padding:7px 10px;border-radius:4px;border:0;background:none;color:var(--ink);text-decoration:none;font-size:14.5px;text-align:left;cursor:pointer;line-height:1.3}
.nv:hover{background:color-mix(in srgb,var(--ink) 6%,transparent)}
.nv[aria-current="page"]{background:var(--accent-soft);color:var(--accent);font-weight:700;box-shadow:inset 3px 0 0 var(--accent)}
.nv-add{color:var(--accent);font-weight:700}
.nv .badge{margin-left:auto;font-size:12px;font-weight:700;padding:0 7px;border-radius:3px;background:var(--line);color:var(--ink-2);font-variant-numeric:tabular-nums}
.nv .badge.warn{background:var(--warn-soft);color:var(--warn)}
.dot{width:9px;height:9px;border-radius:50%;flex:none;background:var(--ink-3)}
.dot.ok{background:var(--ok)}
.dot.warn{background:var(--warn)}
.dot.none{background:transparent;box-shadow:inset 0 0 0 1.6px var(--ink-3)}
.side-h{margin:16px 10px 4px;font-size:11.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3)}
.side-foot{margin-top:auto;padding:16px 10px 0;font-size:12.5px;line-height:1.55;color:var(--ink-2)}
main{padding:28px clamp(16px,3.2vw,44px) 96px;min-width:0}
.wrap{max-width:1060px}

/* Sayfa öğeleri */
.page-h{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:18px}
h1{font-size:27px;line-height:1.2;margin:0;letter-spacing:-.015em}
.crumb{font-size:13px;color:var(--ink-2);margin-bottom:3px}
.lead{font-size:16px;margin:6px 0 0;max-width:62ch}
.actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.h2{font-size:18px;margin:36px 0 12px;letter-spacing:-.01em}
.muted{color:var(--ink-2)}
.small{font-size:13px}
.mono{font-variant-numeric:tabular-nums}
.nowrap{white-space:nowrap}
.card{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:18px 20px}
.note{display:flex;gap:14px;align-items:flex-start;justify-content:space-between;flex-wrap:wrap;padding:12px 16px;border-radius:4px;background:var(--info-soft);margin:0 0 14px;font-size:14px}
.note>div:first-child{flex:1;min-width:240px}
.note{border-left:3px solid var(--info)}
.note.warn{background:var(--warn-soft);border-left-color:var(--warn)}
.note.ok{background:var(--ok-soft);border-left-color:var(--ok)}
.note-act{display:flex;gap:6px;flex-wrap:wrap}
.chips{display:flex;gap:7px;flex-wrap:wrap;align-items:center;margin-top:9px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:2px 10px;border-radius:3px;font-size:12.5px;font-weight:700;background:var(--surface);border:1px solid var(--line);color:var(--ink-2);text-decoration:none;white-space:nowrap}
.chip.ok{background:var(--surface);color:var(--ok);border-color:color-mix(in srgb,var(--ok) 45%,transparent)}
.chip.warn{background:var(--surface);color:var(--warn);border-color:color-mix(in srgb,var(--warn) 45%,transparent)}
.chip.none{background:var(--surface-2)}
ul.chg{margin:6px 0 0;padding-left:20px}
ul.chg li{margin:1px 0}
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:6px;background:var(--surface)}
.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th{text-align:left;font-size:12px;font-weight:700;letter-spacing:.03em;color:var(--ink-2);padding:10px 14px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--surface-2)}
.tbl td{padding:10px 14px;border-bottom:1px solid var(--line);vertical-align:top}
.tbl tbody tr:last-child td{border-bottom:0}
.tbl .rev-x td{background:var(--surface-2)}

/* Karşılama */
.hero{max-width:780px;margin:5vh auto 0}
.hero h1{font-size:36px;margin-top:14px}
.hero .lead{font-size:18.5px;color:var(--ink-2);margin:10px 0 24px}
.feat{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin:30px 0 22px}
.feat div{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:14px 16px;display:flex;flex-direction:column;gap:4px;font-size:14px;color:var(--ink-2)}
.feat b{color:var(--ink);font-size:15px}

/* Genel bakış */
.co-card{display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.co-logo{width:96px;height:64px;display:flex;align-items:center;justify-content:center;border:1px dashed var(--line-2);border-radius:4px;background:#fff;flex:none;overflow:hidden}
.co-logo img{max-width:88px;max-height:56px;object-fit:contain}
.co-info{flex:1;min-width:220px}
.co-name{font-size:18px;font-weight:700;line-height:1.3}
.nologo{font-weight:700;font-size:20px;color:#9aa0a6;letter-spacing:.04em;text-decoration:none}
a.nologo{font-size:13px;color:#1f3b63;border:1px dashed #a9bad3;border-radius:6px;padding:6px 10px}

/* Şirket bilgileri */
.logo-card{display:flex;gap:20px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.logo-box{width:180px;height:110px;display:flex;align-items:center;justify-content:center;border:1px dashed var(--line-2);border-radius:4px;background:#fff;overflow:hidden;flex:none}
.logo-box img{max-width:164px;max-height:94px;object-fit:contain}
.fgroup{margin-bottom:14px}
.fg-h{font-size:16px;margin:0 0 12px}
.fg-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px 16px}
.fi{display:flex;flex-direction:column;gap:4px;min-width:0}
.fi.wide{grid-column:1/-1}
.fi-l{font-size:13px;font-weight:700;color:var(--ink-2);display:flex;gap:8px;align-items:baseline}
.fi-s{font-size:12px;color:var(--ok);font-weight:700}
.fi-h{font-size:12px;color:var(--ink-3)}
.danger-zone{border-color:color-mix(in srgb,var(--danger) 30%,var(--line))}

/* Belge kâğıdı */
.paper{background:#fff;color:var(--p-ink);border:1px solid var(--line);border-radius:6px;box-shadow:0 1px 3px rgba(0,0,0,.08);padding:clamp(16px,4vw,44px)}
.dochead{display:grid;grid-template-columns:150px minmax(0,1fr) 260px;border:1.5px solid var(--p-line);margin-bottom:22px;color:var(--p-ink)}
.dh-logo{display:flex;align-items:center;justify-content:center;padding:10px;border-right:1px solid var(--p-line);min-height:96px}
.dh-logo img{max-width:100%;max-height:72px;object-fit:contain}
.dh-title{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:10px 14px;border-right:1px solid var(--p-line);gap:4px}
.dh-co{font-size:12.5px;color:#4a5058;line-height:1.3}
.dh-doc{font-size:18px;font-weight:700;line-height:1.25}
.dh-meta{width:100%;height:100%;border-collapse:collapse;font-size:12px}
.dh-meta th{text-align:left;font-weight:400;color:#4a5058;padding:4px 9px;border-bottom:1px solid var(--p-line);white-space:nowrap;width:1%}
.dh-meta td{padding:4px 9px;font-weight:700;border-bottom:1px solid var(--p-line);border-left:1px solid var(--p-line);font-variant-numeric:tabular-nums}
.dh-meta tr:last-child th,.dh-meta tr:last-child td{border-bottom:0}
.dh-meta .dr{color:#a15c00}
.sec{position:relative;padding:14px 0 6px}
.sec+.sec{border-top:1px solid #e4e7eb}
.sec-h{display:flex;align-items:flex-start;gap:12px}
.sec-t{font-size:17.5px;line-height:1.3;margin:0 0 8px;flex:1}
.sec-tools{display:flex;gap:4px;opacity:0;transition:opacity .15s;flex:none}
.sec:hover .sec-tools,.sec:focus-within .sec-tools{opacity:1}
@media (hover:none){.sec-tools{opacity:1}}
.sec-tools button{border:1px solid #d9d6ce;background:#fff;color:#2a2f35;border-radius:6px;font-size:12.5px;font-weight:700;padding:3px 9px;cursor:pointer;min-height:28px}
.sec-tools button:hover{background:#f2f1ec}
.sec-tools button:disabled{opacity:.35;cursor:default}
.sec-tools .del{color:#b42318}
.md{font-size:14.5px;line-height:1.62}
.md p{margin:0 0 10px}
.md h3{font-size:15.5px;margin:16px 0 6px}
.md h4{font-size:14.5px;margin:12px 0 4px}
.md ul,.md ol{margin:0 0 10px;padding-left:22px}
.md li{margin:2px 0}
.md table{border-collapse:collapse;width:100%;margin:6px 0 12px;font-size:13.5px}
.md th,.md td{border:1px solid #c9ccd0;padding:6px 9px;text-align:left;vertical-align:top}
.md th{background:var(--p-soft);font-weight:700}
.md .tw{overflow-x:auto}
.callout{border-left:3px solid #1f3b63;background:#f1f4f8;padding:8px 12px;margin:0 0 10px;border-radius:0 6px 6px 0}
.prep{background:#fff8db;border:1px dashed #d4b24a;color:#5f4a00;padding:6px 10px;border-radius:6px;font-size:13px;margin:0 0 10px}
.prep::before{content:"Hazırlık notu · yazdırılmaz";display:block;font-size:11px;font-weight:700;letter-spacing:.03em;opacity:.75}
.ph{background:#e9eef5;border-bottom:1px dotted #1f3b63;border-radius:3px;padding:0 1px}
.ph-empty{background:#fdecea;color:#a3271b;border:1px dashed #e3a39b;border-radius:4px;padding:0 4px;font-size:.92em}
.ph-bad{background:#fdecea;color:#a3271b;font-family:var(--mono);font-size:.9em}
.ph-blank{letter-spacing:.05em;color:#666}
.add-sec{margin-top:16px;width:100%;border-style:dashed}

/* Form alanları */
.form .sec{padding:10px 0 2px}
.form .sec+.sec{border-top:0}
.form .sec-t{font-size:13.5px;background:#eceff2;border:1px solid var(--p-line);padding:5px 10px;margin:0}
.form .sec-h{display:block;position:relative}
.form .sec-tools{position:absolute;right:6px;top:2px}
.form .md{font-size:13.5px}
.form .md>:first-child:not(.fgrid){margin-top:8px}
.form .md>.fgrid:first-child{border-top:0}
.fgrid{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));border-top:1px solid var(--p-line);border-left:1px solid var(--p-line);margin:0 0 12px}
.f{border-right:1px solid var(--p-line);border-bottom:1px solid var(--p-line);padding:5px 9px 6px;min-height:48px;display:flex;flex-direction:column;gap:3px;font-size:12.5px}
.fl{font-weight:700;font-size:12px;color:#3a4048}
.f-uzun{min-height:96px}
.f-secim{flex-direction:row;flex-wrap:wrap;align-items:center;gap:6px 14px;min-height:40px}
.fo{display:flex;flex-wrap:wrap;gap:4px 16px}
.ck{display:inline-flex;align-items:center;gap:6px}
.ck i{width:12px;height:12px;border:1.3px solid #2a2f35;border-radius:2px;flex:none}
.f-kutu{min-height:36px;justify-content:center}
.f-imza{min-height:118px}
.f-imza .sl{font-size:11.5px;color:#5a626c;border-bottom:1px dotted #9aa0a6;padding-top:12px}

/* Bölüm düzenleyici */
.sec.editing{background:#f7f9fc;margin:8px -14px;padding:14px;border:1.5px solid #1f3b63;border-radius:6px}
.sec.editing+.sec{border-top:0}
.ed-l{display:flex;flex-direction:column;gap:4px;font-size:12.5px;font-weight:700;color:#4a5058}
.ed-l input{font-size:16px;font-weight:700;background:#fff;color:#1b1e22;border-color:#cfd2d6}
.ed-bar{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 8px;align-items:center}
.ed-bar button,.ed-bar select{font-size:13px;min-height:31px;width:auto;padding:3px 9px;border:1px solid #cfd2d6;border-radius:6px;background:#fff;color:#1b1e22;cursor:pointer}
.ed-bar button:hover{background:#f2f1ec}
.ed-bar .link{border:0;background:none;color:#1f3b63}
.ed-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px}
.ed-grid textarea{min-height:300px;font:13.5px/1.6 var(--mono);background:#fff;color:#1b1e22;border:1px solid #cfd2d6;border-radius:4px;padding:10px 12px}
.ed-prev{border:1px dashed #cfd2d6;border-radius:4px;padding:10px 14px;background:#fff;max-height:720px;overflow:auto;min-width:0}
.ed-prev-l{font-size:11px;font-weight:700;letter-spacing:.06em;color:#8a9199;text-transform:uppercase;margin-bottom:6px}
.ed-foot{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:10px;font-size:12.5px;color:#4f5760}

/* Fark gösterimi ve kayıt */
.diff{font:12.5px/1.5 var(--mono);border:1px solid var(--line);border-radius:8px;overflow:hidden;margin-top:6px;background:var(--surface)}
.dl{padding:1px 10px;white-space:pre-wrap;word-break:break-word}
.dl .dm{display:inline-block;width:14px;opacity:.7}
.dl.add{background:var(--ok-soft);color:var(--ok)}
.dl.del{background:var(--danger-soft);color:var(--danger)}
.dl.ctx{color:var(--ink-2)}
.dl.gap{color:var(--ink-3);font-style:italic;background:var(--surface-2)}
.sd{margin:12px 0}
.sd-t{font-weight:700;font-size:13.5px}
.filters{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:6px}
.filters select{width:auto;min-width:220px}
.filters input{flex:1;min-width:200px}
.lg-day{font-size:12.5px;font-weight:700;color:var(--ink-2);margin:22px 0 4px;letter-spacing:.03em}
.lg-list{list-style:none;margin:0;padding:0}
.lg{display:grid;grid-template-columns:14px minmax(0,1fr);gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.lg-dot{width:10px;height:10px;border-radius:50%;margin-top:6px;background:var(--ink-3)}
.lg-dot.yayin{background:var(--ok)}
.lg-dot.bolum,.lg-dot.bolum-ekle,.lg-dot.sira,.lg-dot.belge,.lg-dot.belge-ekle{background:var(--info)}
.lg-dot.bolum-sil,.lg-dot.belge-sil,.lg-dot.geri{background:var(--danger)}
.lg-dot.sirket,.lg-dot.logo{background:var(--warn)}
.lg-t{font-weight:700}
.lg-m{font-size:12.5px;color:var(--ink-2)}
.lg-n{font-size:13.5px;margin-top:2px}
.lg details{margin-top:4px;font-size:13px}
.lg summary{cursor:pointer;color:var(--accent);font-weight:700}

/* Hangi form? */
.wiz{margin-bottom:8px}
.wiz-step{font-size:12.5px;font-weight:700;color:var(--ink-3);letter-spacing:.04em}
.wiz-q{font-size:21px;font-weight:700;line-height:1.3;margin-top:4px}
.wiz-btns{display:flex;gap:10px;margin-top:16px;flex-wrap:wrap}
.wiz-btns .btn{min-width:110px}
.wiz-res{border-left:6px solid var(--k,var(--ink-3));padding:4px 0 4px 16px}
.wiz-k{display:flex;align-items:center;gap:10px;font-size:22px;font-weight:700;color:var(--k-t,var(--ink))}
.wiz-k svg{width:26px;height:26px}
.wiz-form{font-size:16px;margin:6px 0 10px}
.kaza{--k:#c62828;--k-t:#b3261e;--k-i:#fff}
.ramak{--k:#e8710a;--k-t:#b45309;--k-i:#fff}
.tehlike{--k:#f2b705;--k-t:#8a6100;--k-i:#1f2328}
@media screen and (prefers-color-scheme:dark){.kaza{--k-t:#f28b82}.ramak{--k-t:#f6a35b}.tehlike{--k-t:#f2c94c}}
.kinds{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.kind{background:var(--surface);border:1px solid var(--line);border-top:5px solid var(--k);border-radius:6px;padding:14px 16px;display:flex;flex-direction:column;gap:7px;font-size:14px}
.kind h3{display:flex;align-items:center;gap:8px;margin:0;font-size:17px;color:var(--k-t)}
.kind h3 svg{width:22px;height:22px}
.kind b{color:var(--ink)}
.kind .k-form{margin-top:auto;padding-top:8px;border-top:1px solid var(--line)}
.flow{display:flex;align-items:stretch;gap:0;flex-wrap:wrap;margin-top:4px}
.flow-b{flex:1;min-width:170px;background:var(--surface);border:1px solid var(--line);border-left:5px solid var(--k);border-radius:6px;padding:10px 14px;font-size:14px}
.flow-b b{display:block;color:var(--k-t)}
.flow-a{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:0 8px;font-size:12px;color:var(--ink-2);text-align:center;min-width:92px}
.flow-a::before{content:"→";font-size:22px;line-height:1;color:var(--ink-3)}

/* Pencereler ve bildirim */
dialog{border:0;border-radius:8px;padding:0;width:min(580px,calc(100vw - 24px));max-height:calc(100vh - 40px);background:var(--surface);color:var(--ink);box-shadow:0 24px 70px rgba(0,0,0,.3)}
dialog.wide{width:min(1000px,calc(100vw - 24px))}
dialog::backdrop{background:rgba(12,14,18,.5)}
dialog form,.dlg-in{padding:22px 24px;display:flex;flex-direction:column;gap:13px}
dialog h2{margin:0;font-size:19px}
dialog p{margin:0}
dialog label{display:flex;flex-direction:column;gap:4px;font-size:13px;font-weight:700;color:var(--ink-2)}
dialog label input,dialog label select,dialog label textarea{font-weight:400;font-size:15px}
.dlg-top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.dlg-foot{display:flex;justify-content:flex-end;gap:8px;margin-top:4px;flex-wrap:wrap}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.numchange{display:flex;align-items:center;gap:16px;flex-wrap:wrap;padding:12px 14px;border-radius:6px;background:var(--surface-2);border:1px solid var(--line)}
.numchange small{display:block;font-size:11.5px;color:var(--ink-3);font-weight:700;letter-spacing:.04em}
.numchange b{font-variant-numeric:tabular-nums}
.numchange .to b{color:var(--accent)}
.bk-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0;border-top:1px solid var(--line)}
#toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,16px);opacity:0;background:#1b1e22;color:#fff;padding:11px 16px;border-radius:6px;font-size:14px;transition:opacity .2s,transform .2s;z-index:100;max-width:calc(100vw - 32px);pointer-events:none;box-shadow:0 8px 24px rgba(0,0,0,.25)}
#toast.on{opacity:1;transform:translate(-50%,0)}
#toast.err{background:#b42318}

@media screen and (max-width:1100px){.ed-grid{grid-template-columns:1fr}}
@media screen and (max-width:860px){
  .shell{grid-template-columns:1fr}
  .side{position:sticky;top:58px;z-index:20;height:auto;flex-direction:row;overflow-x:auto;padding:8px 12px;border-right:0;border-bottom:1px solid var(--line);gap:4px}
  .side-h,.side-foot{display:none}
  .nv{width:auto;white-space:nowrap;flex:none}
  .brand span{display:none}
  .userbtn{display:none}
  .dochead{grid-template-columns:96px minmax(0,1fr)}
  .dh-title{border-right:0}
  .dh-m{grid-column:1/-1;border-top:1px solid var(--p-line)}
  .kinds,.fg-grid,.row2{grid-template-columns:1fr}
  .flow{flex-direction:column}
  .flow-a{padding:4px 0;flex-direction:row;gap:8px}
  .flow-a::before{content:"↓"}
  .sec.editing{margin:8px -6px;padding:10px}
}

/* Yazdırma */
#print{display:none}
@media print{
  html,body{background:#fff!important;color:#000}
  .top,.shell,#toast,dialog{display:none!important}
  #print{display:block;font-family:var(--f)}
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .ptable{width:100%;border-collapse:collapse}
  .ptable>thead>tr>td{padding:0 0 5mm}
  .ptable>tbody>tr>td{padding:0}
  .ptable .dochead{margin:0}
  .pdoc+.pdoc{break-before:page}
  .cover{break-after:page}
  .sec-t{break-after:avoid}
  .md tr,.f,.callout,.appr{break-inside:avoid}
  .md{font-size:10pt;line-height:1.5}
  .md table{font-size:9.5pt}
  .sec-t{font-size:12.5pt}
  .form .sec-t{font-size:10pt}
  .form .md{font-size:9.5pt}
  .f{font-size:9pt}
  .fl{font-size:8.5pt}
  .dh-doc{font-size:13pt}
  .dh-co{font-size:9pt}
  .dh-meta{font-size:8.5pt}
  .dh-logo{min-height:22mm}
  .dh-logo img{max-height:17mm}
  .draftmark{position:fixed;top:42%;left:0;right:0;text-align:center;font:700 92pt/1 Arial,sans-serif;color:rgba(180,35,24,.11);transform:rotate(-28deg);pointer-events:none}
  .plain .btn,.plain .actions,.plain .filters,.plain details{display:none!important}
}
.cover{display:flex;flex-direction:column;align-items:center;text-align:center;padding-top:26mm;color:#1b1e22}
.cv-logo img{max-height:36mm;max-width:90mm;object-fit:contain}
.cv-co{font-size:14pt;margin-top:12mm;color:#333}
.cv-title{font-size:27pt;font-weight:700;margin:3mm 0 9mm;line-height:1.15}
.cv-sub{font-size:11pt;color:#444;margin:-5mm 0 9mm;max-width:130mm}
.cv-meta{border-collapse:collapse;font-size:10pt}
.cv-meta th,.cv-meta td{border:1px solid #2a2f35;padding:2mm 4mm;text-align:left}
.cv-meta th{font-weight:400;color:#444;background:#f2f3f1}
.cv-meta td{font-weight:700}
.cv-toc{width:100%;max-width:140mm;text-align:left;margin-top:14mm}
.cv-toc-h{font-weight:700;font-size:12pt;border-bottom:1.5px solid #2a2f35;padding-bottom:2mm;margin-bottom:3mm}
.cv-toc ol{margin:0;padding-left:7mm;font-size:10.5pt;line-height:1.75}
.cv-list{width:100%;max-width:170mm;margin-top:10mm;text-align:left}
.revt{margin-top:8mm;break-inside:avoid}
.revt h3,.appr-h{font-size:11.5pt;margin:0 0 2mm}
.appr{display:grid;grid-template-columns:1fr 1fr;border:1px solid #2a2f35;margin-top:6mm;font-size:10pt}
.appr>div{padding:3mm 4mm;min-height:30mm;display:flex;flex-direction:column;gap:1.5mm}
.appr>div+div{border-left:1px solid #2a2f35}
.appr b{font-size:9pt;color:#444;font-weight:700;letter-spacing:.03em}
.appr .sig{margin-top:auto;border-top:1px dotted #888;padding-top:1mm;font-size:8.5pt;color:#666}
.poster{color:#1b1e22}
.pst-title{font-size:19pt;font-weight:700;margin:5mm 0 1mm;line-height:1.2}
.pst-sub{font-size:10pt;color:#444;margin-bottom:4mm}
.pst-row{display:grid;grid-template-columns:44mm 1fr;border:2px solid var(--k);border-radius:4mm;overflow:hidden;margin-bottom:4mm;break-inside:avoid}
.pst-tag{background:var(--k);color:var(--k-i);padding:4mm;display:flex;flex-direction:column;gap:2mm;justify-content:center}
.pst-tag svg{width:10mm;height:10mm}
.pst-tag svg [stroke="#fff"]{stroke:var(--k)}
.pst-tag svg [fill="#fff"]{fill:var(--k)}
.pst-tag b{font-size:15pt;line-height:1.1}
.pst-no{font-size:9pt;opacity:.92}
.pst-b{padding:3mm 5mm;font-size:9.5pt;line-height:1.4;display:flex;flex-direction:column;gap:1mm}
.pst-q{font-size:12pt;font-weight:700}
.pst-emg{display:grid;grid-template-columns:repeat(4,1fr);border:2px solid #1b1e22;border-radius:4mm;overflow:hidden;margin-top:2mm}
.pst-emg div{padding:3mm 4mm;border-left:1px solid #1b1e22;font-size:9pt}
.pst-emg div:first-child{border-left:0;background:#c62828;color:#fff}
.pst-emg b{display:block;font-size:13pt}
</style>
</head>
<body>
<header class="top" id="top"></header>
<div class="shell" id="shell"><nav class="side" id="side" aria-label="Bölümler"></nav><main id="main"></main></div>
<div id="print"></div>
<dialog id="dlg"></dialog>
<div id="toast" role="status" aria-live="polite"></div>
<input type="file" id="logoFile" accept="image/*" hidden>
<input type="file" id="importFile" accept=".json,application/json" hidden>
<script>
(()=>{
'use strict';
const APP='kurumkitabi', FILE_APP='kurum-kitabi';

/* ---------- Yardımcılar ---------- */
const $=(s,r=document)=>r.querySelector(s);
const $$=(s,r=document)=>Array.from(r.querySelectorAll(s));
const ESC={'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>ESC[c]);
const uid=()=>Date.now().toString(36).slice(-5)+Math.random().toString(36).slice(2,8);
const pad2=n=>String(n).padStart(2,'0');
const nowISO=()=>new Date().toISOString();
function toDate(v){
  if(!v) return null;
  if(/^\d{4}-\d{2}-\d{2}$/.test(v)){const [y,m,d]=v.split('-').map(Number);return new Date(y,m-1,d);}
  const d=new Date(v);return isNaN(d)?null:d;
}
const fmtD=v=>{const d=toDate(v);return d?`${pad2(d.getDate())}.${pad2(d.getMonth()+1)}.${d.getFullYear()}`:'—';};
const fmtT=v=>{const d=toDate(v);return d?`${pad2(d.getHours())}:${pad2(d.getMinutes())}`:'';};
const fmtDT=v=>v?fmtD(v)+' '+fmtT(v):'—';
const dayInput=(d=new Date())=>`${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())}`;
const revStr=n=>pad2(n);
const TR_ASCII={'ç':'c','ğ':'g','ı':'i','İ':'I','ö':'o','ş':'s','ü':'u','Ç':'C','Ğ':'G','Ö':'O','Ş':'S','Ü':'U'};
const ascii=s=>String(s||'').replace(/[çğıİöşüÇĞÖŞÜ]/g,c=>TR_ASCII[c]);
const slug=s=>ascii(s).replace(/[^A-Za-z0-9]+/g,'-').replace(/^-|-$/g,'').slice(0,40)||'sirket';
const normKod=s=>ascii(String(s||'').toLocaleUpperCase('tr-TR')).replace(/[^A-Z0-9-]/g,'').slice(0,10);
function suggestKod(unvan){
  const skip=/^(a\.?ş\.?|ltd\.?|şti\.?|san\.?|tic\.?|ve|ltd\.şti\.?|anonim|limited|şirketi|sanayi|ticaret|ith\.?|ihr\.?)$/i;
  const w=String(unvan||'').split(/\s+/).filter(x=>x&&!skip.test(x));
  return normKod(w.slice(0,3).map(x=>x[0]).join(''))||'SRK';
}

/* ---------- Şirket bilgisi alanları ---------- */
const FIELDS=[
 ['Şirket kimliği',[
  {k:'unvan',l:'Şirket ünvanı',ph:'Örnek Sanayi ve Ticaret A.Ş.',wide:true},
  {k:'kisa_ad',l:'Kısa ad',ph:'Örnek Sanayi'},
  {k:'kod',l:'Belge kodu öneki',ph:'ORN',hint:'Belge numaralarının başına gelir, ör. ORN-ISG-01'},
  {k:'faaliyet',l:'Faaliyet konusu',ph:'metal parça imalatı',wide:true},
  {k:'adres',l:'Adres',type:'textarea',wide:true},
  {k:'telefon',l:'Telefon'},
  {k:'eposta',l:'E-posta'},
  {k:'web',l:'Web sitesi'},
  {k:'vergi',l:'Vergi dairesi / numarası'},
 ]],
 ['İşyeri ve tehlike sınıfı',[
  {k:'sgk_sicil',l:'SGK işyeri sicil numarası'},
  {k:'nace',l:'NACE kodu',ph:'25.62.01'},
  {k:'tehlike_sinifi',l:'Tehlike sınıfı',type:'select',opts:[['','Seçin'],['az','Az tehlikeli'],['tehlikeli','Tehlikeli'],['cok','Çok tehlikeli']],hint:'Eğitim, muayene ve risk değerlendirmesi süreleri buna göre yazılır'},
  {k:'calisan_sayisi',l:'Çalışan sayısı',type:'number'},
 ]],
 ['Sorumlular',[
  {k:'isveren',l:'İşveren / işveren vekili',ph:'Ad Soyad (Genel Müdür)'},
  {k:'ik_sorumlusu',l:'İnsan kaynakları sorumlusu'},
  {k:'isg_uzmani',l:'İş güvenliği uzmanı'},
  {k:'isyeri_hekimi',l:'İşyeri hekimi'},
  {k:'calisan_temsilcisi',l:'Çalışan temsilcisi'},
  {k:'ilkyardimci',l:'İlk yardımcı(lar)'},
  {k:'destek',l:'Destek elemanları',ph:'Yangın, arama-kurtarma, tahliye ekibi',wide:true},
 ]],
 ['Çalışma düzeni',[
  {k:'calisma_saatleri',l:'Çalışma saatleri',ph:'Pazartesi–Cuma 08.00–18.00'},
  {k:'mola',l:'Ara dinlenme',ph:'12.00–13.00 öğle arası'},
  {k:'maas_gunu',l:'Ücret ödeme günü',ph:'her ayın son iş günü'},
  {k:'yan_haklar',l:'Yan haklar',type:'textarea',ph:'Öğle yemeği, personel servisi, özel sağlık sigortası',wide:true},
 ]],
 ['Acil durum',[
  {k:'toplanma_yeri',l:'Acil toplanma alanı',ph:'Ana giriş karşısındaki otopark'},
  {k:'acil_tel_ic',l:'İç acil durum hattı',ph:'Dahili 100'},
  {k:'saglik_kurulusu',l:'En yakın sağlık kuruluşu',wide:true},
 ]],
];
const FIELD_LIST=FIELDS.flatMap(g=>g[1]);
const FIELD_MAP=Object.fromEntries(FIELD_LIST.map(f=>[f.k,f]));
const SINIF={
  az:{ad:'az tehlikeli',egitim:'üç yılda en az bir kez',saat:'8',risk:'en geç altı yılda bir',saglik:'en geç beş yılda bir',uzman:'en az (C) sınıfı'},
  tehlikeli:{ad:'tehlikeli',egitim:'iki yılda en az bir kez',saat:'12',risk:'en geç dört yılda bir',saglik:'en geç üç yılda bir',uzman:'en az (B) sınıfı'},
  cok:{ad:'çok tehlikeli',egitim:'yılda en az bir kez',saat:'16',risk:'en geç iki yılda bir',saglik:'en geç yılda bir',uzman:'(A) sınıfı'},
};
const COMPUTED=[
  {k:'egitim_periyodu',l:'İSG eğitimi tekrar sıklığı',f:s=>s.egitim},
  {k:'egitim_suresi',l:'İSG eğitimi asgari süresi (saat)',f:s=>s.saat},
  {k:'risk_periyodu',l:'Risk değerlendirmesi ve acil durum planı yenileme',f:s=>s.risk},
  {k:'saglik_periyodu',l:'Periyodik sağlık muayenesi sıklığı',f:s=>s.saglik},
  {k:'uzman_sinifi',l:'İş güvenliği uzmanı belge sınıfı',f:s=>s.uzman},
];
const PH_RE=/\{\{\s*([a-z_]+(?::[a-z0-9_]+)?)\s*\}\}/g;

/* ---------- Durum ve saklama ---------- */
const store={
  get(k){try{return JSON.parse(localStorage.getItem(APP+':'+k));}catch{return null;}},
  set(k,v){try{localStorage.setItem(APP+':'+k,JSON.stringify(v));return true;}catch(e){toast('Kaydedilemedi: tarayıcı belleği dolu olabilir. Yedek indirip eski şirketleri silin.','err');return false;}},
  del(k){try{localStorage.removeItem(APP+':'+k);}catch{}},
};
let meta=store.get('meta')||{list:[],active:null,user:''};
if(!Array.isArray(meta.list)) meta.list=[];
let C=null;
let editing=null;
let wz={step:0,res:null};
let lf={doc:'',q:''};
function loadActive(){
  C=meta.active?store.get('c:'+meta.active):null;
  if(!C&&meta.list.length){meta.active=meta.list[0].id;C=store.get('c:'+meta.active);}
  if(C) sanitizeCompany(C);
}
function coName(c){return String(c.info.kisa_ad||c.info.unvan||'Adsız şirket').trim();}
function saveMeta(){store.set('meta',meta);}
function persist(){
  if(C){
    store.set('c:'+C.id,C);
    const e=meta.list.find(x=>x.id===C.id);
    if(e) e.name=coName(C); else meta.list.push({id:C.id,name:coName(C)});
  }
  saveMeta();
}
function sanitizeCompany(c){
  const okId=s=>typeof s==='string'&&/^[a-z0-9]{3,40}$/i.test(s);
  if(!okId(c.id)) c.id=uid();
  c.info=c.info&&typeof c.info==='object'?c.info:{};
  for(const k of Object.keys(c.info)) c.info[k]=String(c.info[k]??'');
  if(typeof c.logo!=='string'||!/^data:image\/(png|jpeg|webp|gif|svg\+xml);base64,[A-Za-z0-9+/=]+$/.test(c.logo)) c.logo='';
  c.docs=Array.isArray(c.docs)?c.docs:[];
  for(const d of c.docs){
    if(!okId(d.id)) d.id=uid();
    if(typeof d.role!=='string'||!/^[a-z0-9]{1,20}$/.test(d.role)) d.role='x'+uid().slice(-5);
    d.kind=d.kind==='form'?'form':'metin';
    d.title=String(d.title||'Adsız belge');d.code=String(d.code||'');
    d.sections=(Array.isArray(d.sections)?d.sections:[]).map(s=>({id:okId(s.id)?s.id:uid(),title:String(s.title||''),body:String(s.body||'')}));
    d.revisions=Array.isArray(d.revisions)?d.revisions:[];
  }
  c.log=Array.isArray(c.log)?c.log:[];
  for(const e of c.log){e.act=String(e.act||'').replace(/[^a-z-]/g,'');}
  return c;
}

/* ---------- Değerler ve yer tutucular ---------- */
function docNo(c,d){return [String(c.info.kod||'').trim(),d.code].filter(Boolean).join('-');}
function roleDoc(c,r){return c.docs.find(d=>d.role===r);}
function resolve(c,k){
  const info=c.info||{};
  if(k.startsWith('no:')){const d=roleDoc(c,k.slice(3));return d?docNo(c,d):null;}
  const cp=COMPUTED.find(x=>x.k===k);
  if(cp){const s=SINIF[info.tehlike_sinifi];return s?cp.f(s):'';}
  if(k==='tehlike_sinifi') return SINIF[info.tehlike_sinifi]?.ad||'';
  if(k==='kisa_ad') return String(info.kisa_ad||info.unvan||'').trim();
  if(!FIELD_MAP[k]) return null;
  return String(info[k]??'').trim().replace(/\s*\n\s*/g,', ');
}
function phLabel(k,c=C){
  if(k.startsWith('no:')){const d=c&&roleDoc(c,k.slice(3));return d?`${d.title} numarası`:'Belge numarası';}
  return FIELD_MAP[k]?.l||COMPUTED.find(x=>x.k===k)?.l||k;
}
function displayVal(k,v){
  const f=FIELD_MAP[k];v=String(v??'').trim();
  if(f&&f.type==='select'){const o=f.opts.find(o=>o[0]===v);return v&&o?o[1]:v;}
  return v;
}
function usedKeys(d){
  const set=new Set(['unvan','kod']);
  for(const s of d.sections) for(const m of (s.title+'\n'+s.body).matchAll(PH_RE)) set.add(m[1]);
  return [...set].sort();
}
function mkCtx(c,{info=null,print=false}={}){
  return {print,ph(k){
    const v=info&&Object.prototype.hasOwnProperty.call(info,k)?info[k]:resolve(c,k);
    if(v===null) return `<span class="ph-bad" title="Tanımsız alan">{{${esc(k)}}}</span>`;
    if(!v) return print?'<span class="ph-blank">……………………</span>':`<span class="ph-empty" title="Şirket bilgileri sayfasından doldurun">${esc(phLabel(k,c))}</span>`;
    return print?esc(v):`<span class="ph" title="${esc(phLabel(k,c))} · şirket bilgilerinden">${esc(v)}</span>`;
  }};
}

/* ---------- Biçim çözücü ---------- */
function inl(s,cx){
  return esc(s).replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>').replace(PH_RE,(m,k)=>cx.ph(k));
}
const FIELD_RE=/^\[(alan|uzun|secim|imza|kutu)\]\s*(.*)$/i;
const isBlock=t=>/^#{2,3}\s/.test(t)||/^[-*•]\s+/.test(t)||/^\d+[.)]\s+/.test(t)||t.startsWith('>')||t.startsWith('|')||t.startsWith('//')||FIELD_RE.test(t);
function fieldsHTML(items,cx){
  // Yarım genişlikli alanlar ikişer, imzalar üçer yan yana dizilir; artan alan satırı doldurur.
  const out=[];let i=0;
  while(i<items.length){
    const t=items[i].type;
    if(t==='alan'||t==='kutu'||t==='imza'){
      const run=[];while(i<items.length&&items[i].type===t){run.push(items[i]);i++;}
      const per=t==='imza'?3:2;

function diffLines(a,b){
  const A=String(a||'').split('\n'),B=String(b||'').split('\n');
  if(a==='') A.length=0;
  if(b==='') B.length=0;
  const n=A.length,m=B.length;
  let s=0;while(s<n&&s<m&&A[s]===B[s]) s++;
  let e=0;while(e<n-s&&e<m-s&&A[n-1-e]===B[m-1-e]) e++;
  const a2=A.slice(s,n-e),b2=B.slice(s,m-e),N=a2.length,M=b2.length;
  const dp=Array.from({length:N+1},()=>new Uint16Array(M+1));
  for(let i=N-1;i>=0;i--) for(let j=M-1;j>=0;j--) dp[i][j]=a2[i]===b2[j]?dp[i+1][j+1]+1:Math.max(dp[i+1][j],dp[i][j+1]);
  const ops=A.slice(0,s).map(x=>['=',x]);
  let i=0,j=0;
  while(i<N&&j<M){if(a2[i]===b2[j]){ops.push(['=',a2[i]]);i++;j++;}else if(dp[i+1][j]>=dp[i][j+1]){ops.push(['-',a2[i++]]);}else{ops.push(['+',b2[j++]]);}}
  while(i<N) ops.push(['-',a2[i++]]);
  while(j<M) ops.push(['+',b2[j++]]);
  A.slice(n-e).forEach(x=>ops.push(['=',x]));
  return ops;
}
function compactDiff(ops,ctx=1){
  const keep=ops.map(()=>false);
  ops.forEach((o,i)=>{if(o[0]!=='=') for(let j=Math.max(0,i-ctx);j<=Math.min(ops.length-1,i+ctx);j++) keep[j]=true;});
  const out=[];let skip=0;
  ops.forEach((o,i)=>{if(keep[i]){if(skip){out.push(['…',skip]);skip=0;}out.push(o);}else skip++;});
  if(skip) out.push(['…',skip]);
  return out;
}

  if(!ops||!ops.length) return '';
  return `<div class="diff">${ops.map(o=>o[0]==='…'?`<div class="dl gap">… ${o[1]} satır değişmedi</div>`:`<div class="dl ${o[0]==='+'?'add':o[0]==='-'?'del':'ctx'}"><span class="dm">${o[0]==='='?' ':o[0]}</span>${esc(o[1])||'&nbsp;'}</div>`).join('')}</div>`;
}

function changesBetween(a,b,c=C){
  if(!a) return ['İlk yayın'];
  const out=[];
  if(a.title!==b.title) out.push(`Belge adı değişti: “${a.title}” → “${b.title}”`);
  if(a.code!==b.code) out.push(`Doküman kodu değişti: ${a.code} → ${b.code}`);
  const am=new Map(a.sections.map(s=>[s.id,s])),bm=new Map(b.sections.map(s=>[s.id,s]));
  b.sections.forEach((s,i)=>{
    const o=am.get(s.id);
    if(!o){out.push(`Bölüm eklendi: ${i+1}. ${s.title}`);return;}
    if(o.title!==s.title) out.push(`Bölüm başlığı değişti: “${o.title}” → “${s.title}”`);
    if(o.body!==s.body) out.push(`Bölüm güncellendi: ${i+1}. ${s.title}`);
  });
  a.sections.forEach(s=>{if(!bm.has(s.id)) out.push(`Bölüm silindi: ${s.title}`);});
  const ao=a.sections.filter(s=>bm.has(s.id)).map(s=>s.id).join(),bo=b.sections.filter(s=>am.has(s.id)).map(s=>s.id).join();
  if(ao!==bo) out.push('Bölüm sırası değişti');
  const ai=a.info||{},bi=b.info||{};
  for(const k of Object.keys(bi)){
    if(!(k in ai)||ai[k]===bi[k]) continue;
    if(k.startsWith('no:')) out.push(`Atıf yapılan belge numarası değişti: ${ai[k]||'boş'} → ${bi[k]||'boş'}`);
    else out.push(`Şirket bilgisi değişti: ${phLabel(k,c)} (${ai[k]||'boş'} → ${bi[k]||'boş'})`);
  }
  return out;
}

## Saç, sakal ve kişisel bakım
- Saç, sakal ve bıyık temiz ve bakımlı tutulur.
- Makine ve hareketli ekipman başında omuz hizasını geçen saç toplanır, bone ya da baret altına alınır.

- Gıda, ilaç ve temiz oda gibi hijyen gerektiren alanlarda bone ve gerektiğinde sakal filesi kullanılır.
- Tırnaklar kısa ve temiz tutulur; üretim ve hijyen alanlarında takma tırnak kullanılmaz.
- Parfüm ve deodorant ölçülü kullanılır; kişisel hijyene özen gösterilir.

## Kadın çalışanlar
- Üretim ve saha alanlarında etek ve elbise yerine iş kıyafeti (pantolon) giyilir. Ofiste sade ve iş ortamına uygun etek, elbise veya pantolon giyilebilir.
- Uzun saç makine başında toplanır; toka ve saç aksesuarları makineye takılmayacak şekilde seçilir.
- Başörtüsü kullanan çalışanlar makine ve hareketli ekipman başında başörtüsünü ucu sarkmayacak şekilde bağlar ya da işverenin sağladığı uygun başlığı kullanır. Baret gereken alanlarda baret altına uygun model tercih edilir.
- Üretim alanında topuklu ayakkabı giyilmez; ofiste de merdiven ve yürüme yollarında güvenliği bozacak ayakkabı tercih edilmez.
- Makyaj ve aksesuar sade olur; makine başında takı takılmaz.
- Gebe ve emziren çalışanlara bedenine uygun iş kıyafeti ve güvenli ayakkabı sağlanır; gerektiğinde işyeri hekiminin önerisiyle kıyafet ve KKD düzenlenir.

- **Yetkinlikler:** Mevzuat bilgisi, risk analizi, eğitim verme

## İSG sorumlulukları
- Görevlerini İş Güvenliği Uzmanlarının Görev, Yetki, Sorumluluk ve Eğitimleri Hakkında Yönetmelik'e uygun olarak yürütür.
`],
['İşyeri Hekimi',`
| Pozisyon bilgisi | Açıklama |
|---|---|
| Bölüm | İş Sağlığı ve Güvenliği |

## Amaç
Çalışanların sağlığını korumak ve geliştirmek; sağlık gözetimini mevzuata uygun yürütmek.

## Görev ve sorumluluklar

2. Periyodik muayenelerin {{saglik_periyodu}} yapılmasını takip eder.
3. Risk değerlendirmesine sağlık yönünden katılır.
4. İlk yardım ve acil müdahale organizasyonunu planlar.
5. Çalışanlara sağlık konularında eğitim verir.
6. Meslek hastalığı şüphesi olan durumları değerlendirir ve bildirir.

## Yetkiler
- Sağlık açısından uygun bulmadığı çalışanın o işte çalıştırılmaması için işverene bildirim
- Çalışanların sağlık kayıtlarına erişim (gizlilik kuralları içinde)

## Aranan nitelikler

## İSG sorumlulukları

`],
['Çalışan Temsilcisi',`
| Pozisyon bilgisi | Açıklama |
|---|---|
| Seçim | Çalışanlar arasından seçimle ya da seçim yapılamazsa atama ile |

## Görev ve sorumluluklar
1. Çalışanların İSG ile ilgili görüş, öneri ve şikâyetlerini işverene iletir.
2. Risklerin azaltılması için işverenden önlem alınmasını talep eder.
3. Risk değerlendirmesi ve İSG eğitimlerinin planlanması çalışmalarına katılır.

## Yetkiler
- İSG konularında işverene öneride bulunma
- Görevini yerine getirmek için gerekli zaman ve imkânın sağlanmasını isteme

## İSG sorumlulukları
- Temsilcilik görevi nedeniyle hakları kısıtlanmaz; görevini tarafsız ve çalışanlar adına yürütür.
`],
['Destek Elemanı ve İlk Yardımcı',`
| Pozisyon bilgisi | Açıklama |
|---|---|
| Görevlendirme | İşveren tarafından, uygun nitelikteki çalışanlar arasından |
| Destek elemanları | {{destek}} |
| İlk yardımcılar | {{ilkyardimci}} |

## Amaç
Acil durumlarda yangınla mücadele, arama, kurtarma, tahliye ve ilk yardım işlerini ilk müdahale düzeyinde yürütmek.

## Görev ve sorumluluklar
1. Acil durum planındaki görevini bilir ve tatbikatlara katılır.
2. Yangın söndürücü, ilk yardım dolabı ve acil durum ekipmanının yerini ve kullanılabilir olduğunu kontrol eder.
3. Acil durumda tahliyeyi yönlendirir, toplanma alanında ({{toplanma_yeri}}) sayımı yapar.
4. İlk yardımcılar, yaralıya profesyonel ekip gelene kadar ilk yardım uygular.

## Aranan nitelikler
- **Destek elemanı:** Acil durum (yangın, arama-kurtarma, tahliye) eğitimi almış olmak
- **İlk yardımcı:** Geçerli ilk yardımcı sertifikasına sahip olmak

## İSG sorumlulukları

`],
['Görev Tanımı Tebliğ Tutanağı',`
Pozisyonuma ait görev tanımının bir örneğini aldım, okudum ve anladım. Görev ve sorumluluklarımı bu görev tanımına ve şirket kurallarına uygun olarak yerine getireceğimi beyan ederim.

mkDoc('isg','metin','İş Sağlığı ve Güvenliği Kuralları','ISG-01',[
['Amaç, Kapsam ve Dayanak',`
## Amaç
Bu belge, {{unvan}} işyerinde iş kazalarını ve meslek hastalıklarını önlemek, çalışanların sağlığını ve güvenliğini korumak için uyulması zorunlu kuralları belirler.

## Kapsam
Kurallar; tüm çalışanları, stajyerleri, alt işveren çalışanlarını ve işyerine gelen ziyaretçileri kapsar.

## Dayanak
- 6331 sayılı İş Sağlığı ve Güvenliği Kanunu
- İş Sağlığı ve Güvenliği Risk Değerlendirmesi Yönetmeliği
- Çalışanların İş Sağlığı ve Güvenliği Eğitimlerinin Usul ve Esasları Hakkında Yönetmelik
- İşyerlerinde Acil Durumlar Hakkında Yönetmelik
- Kişisel Koruyucu Donanımların İşyerlerinde Kullanılması Hakkında Yönetmelik
- 5510 sayılı Sosyal Sigortalar ve Genel Sağlık Sigortası Kanunu (iş kazası bildirimi)

| İşyeri bilgisi | Değer |
|---|---|
| SGK işyeri sicil numarası | {{sgk_sicil}} |
| NACE kodu | {{nace}} |
| Tehlike sınıfı | {{tehlike_sinifi}} |
| Çalışan sayısı | {{calisan_sayisi}} |
`],
['Tanımlar',`
- **İş kazası:** İşyerinde veya işin yürütümü nedeniyle meydana gelen, ölüme sebebiyet veren veya vücut bütünlüğünü ruhen ya da bedenen engelli hâle getiren olaydır (6331 sayılı Kanun md. 3).
- **Ramak kala olay:** İşyerinde meydana gelen; çalışanı, iş ekipmanını ya da işyerini zarara uğratma potansiyeli olduğu hâlde zarara uğratmayan olaydır.
- **Tehlikeli durum:** Henüz bir olaya yol açmamış, ancak zarar verme potansiyeli taşıyan koşul (güvensiz durum) ya da davranıştır (güvensiz davranış). Örnek: kaygan zemin, koruyucusu sökülmüş makine, önü kapatılmış acil çıkış, kişisel koruyucu donanım kullanmadan çalışma.
- **Tehlike:** İşyerinde var olan ya da dışarıdan gelebilecek, çalışanı veya işyerini etkileyebilecek zarar veya hasar verme potansiyelidir.
- **Risk:** Tehlikeden kaynaklanacak kayıp, yaralanma ya da başka zararlı sonuç meydana gelme ihtimalidir.
- **Meslek hastalığı:** Mesleki risklere maruziyet sonucu ortaya çıkan hastalıktır.
- **Kişisel koruyucu donanım (KKD):** Çalışanı işteki risklere karşı koruyan baret, gözlük, eldiven, iş ayakkabısı, kulak koruyucu gibi donanımlardır.
`],
['Görev ve Sorumluluklar',`
## İşveren ({{isveren}})
- Çalışanların sağlık ve güvenliğini sağlar; risk değerlendirmesini yaptırır ve önlemleri uygular.
- Gerekli kişisel koruyucu donanımı ücretsiz sağlar.
- Çalışanlara İSG eğitimi verilmesini sağlar.

## İş güvenliği uzmanı ({{isg_uzmani}}) ve işyeri hekimi ({{isyeri_hekimi}})
- İşvereni İSG konularında bilgilendirir ve rehberlik eder.
- Risk değerlendirmesine katılır, eğitimleri planlar.
- Bildirimleri inceler; düzeltici ve önleyici faaliyetleri takip eder.
- İşyeri hekimi sağlık gözetimini yürütür, ilk yardım ve acil müdahale organizasyonunu planlar.

## Bölüm yöneticileri
- Ekibinin kurallara uymasını sağlar ve örnek olur.
- Bildirimleri zamanında iletir, olay yerini korur.

## Çalışan temsilcisi ({{calisan_temsilcisi}})
- Çalışanların İSG ile ilgili görüş ve önerilerini işverene iletir.

## Çalışanlar (6331 sayılı Kanun md. 19)
- Makine, cihaz, araç ve tehlikeli maddeleri kurallara uygun kullanır; güvenlik donanımlarını çıkarmaz ve değiştirmez.
- Kendisine verilen kişisel koruyucu donanımı doğru kullanır ve korur.
- Ciddi ve yakın bir tehlikeyle karşılaştığında veya koruma tedbirlerinde bir eksiklik gördüğünde işverene ya da çalışan temsilcisine derhal haber verir.
- Kendi görev alanında sağlık ve güvenlik için işveren ve çalışan temsilcisiyle iş birliği yapar.

## Destek elemanları ve ilk yardımcılar
- Destek elemanları ({{destek}}) yangınla mücadele, arama, kurtarma ve tahliye işlerini yürütür.
- İlk yardımcılar ({{ilkyardimci}}) ilk müdahaleyi yapar.

Pozisyon bazında ayrıntılı görev ve sorumluluklar Görev Tanımları belgesinde ({{no:gorev}}) yer alır.
`],
['Genel Güvenlik Kuralları',`
1. İşe başlamadan önce görevinizle ilgili İSG eğitimini almış olmalısınız.
2. Yetkiniz ve eğitiminiz olmayan makine, araç ve ekipmanı kullanmayın.
3. Makinelerin koruyucularını sökmeyin, güvenlik sistemlerini devre dışı bırakmayın.
4. Bakım, onarım ve temizlik öncesinde makineyi durdurun, enerjisini kesin ve etiketleyin.
5. Belirlenen kişisel koruyucu donanımı her zaman kullanın.
6. Çalışma alanınızı düzenli ve temiz tutun; yürüme yollarına malzeme bırakmayın.
7. Acil çıkışların, yangın söndürücülerin ve elektrik panolarının önünü kapatmayın.
8. Elektrik panolarına ve tesisatına yalnız yetkili kişiler müdahale eder.
9. Kimyasalları etiketsiz kaplara koymayın; kullanmadan önce güvenlik bilgi formunu okuyun.
10. Ağır yükleri dizlerinizi bükerek ve sırtınızı düz tutarak kaldırın; gerektiğinde yardım veya kaldırma ekipmanı kullanın.
11. Merdivenlerde koşmayın, tırabzanı kullanın.
12. Yüksekte çalışma, kapalı alanda çalışma ve sıcak işler (kaynak, kesme) iş izniyle yapılır.
13. Arızalı ekipmanı kullanmayın; etiketleyip yöneticinize bildirin.
14. İşyerine alkollü ya da çalışmanızı tehlikeye sokacak ilaç etkisi altında gelmeyin.
15. Ziyaretçiler işyerinde refakatçiyle dolaşır ve belirlenen KKD'yi kullanır.

// Kuralları işyerinizin risk değerlendirmesine göre ekleyin veya çıkarın.
`],
['Kişisel Koruyucu Donanım (KKD)',`
Kişisel koruyucu donanım işveren tarafından ücretsiz sağlanır ve tutanakla zimmetlenir. Hasar gören veya kullanım ömrü dolan donanım derhal değiştirilir.

| Çalışma alanı / görev | Kullanılması zorunlu KKD |
|---|---|
| Üretim alanı | Baret, koruyucu gözlük, iş eldiveni, çelik burunlu iş ayakkabısı, kulak koruyucu |
| Depo ve sevkiyat | Çelik burunlu iş ayakkabısı, iş eldiveni, yüksek görünürlüklü yelek |
| Bakım ve onarım | Koruyucu gözlük, iş eldiveni, iş ayakkabısı; elektrik işlerinde yalıtkan eldiven |
| Kimyasal kullanımı | Kimyasal eldiven, koruyucu gözlük veya yüz siperi, gerektiğinde maske |
| Ofis | Gerekmez |

// Tabloyu risk değerlendirmenizdeki KKD matrisine göre düzenleyin.
`],
['Bildirimler: Hangi Durumda Hangi Form?',`
Her çalışan gördüğü tehlikeyi ve yaşadığı olayı bildirmekle yükümlüdür. Bildirimler olayların tekrarlanmasını ve daha ağır sonuçlara dönüşmesini önlemek için yapılır; bildirimde bulunan çalışan bu nedenle cezalandırılmaz.

| Durum | Örnek | Kullanılacak form | Ne zaman | Kime |
|---|---|---|---|---|
| **Tehlikeli durum:** henüz olay yok, zarar verebilecek bir durum ya da davranış var | Kaygan zemin, önü kapatılmış acil çıkış, koruyucusu sökülmüş makine, baretsiz çalışma | Tehlikeli Durum Bildirim Formu ({{no:tehlike}}) | Fark edildiği anda, aynı vardiya içinde | Bağlı yönetici ve iş güvenliği uzmanı |
| **Ramak kala:** olay yaşandı, kimse yaralanmadı | Raftan düşen kutunun kimseye çarpmaması, forkliftin yayaya az kalsın çarpması, kayıp düşmeden toparlanma | Ramak Kala Olay Bildirim Formu ({{no:ramak}}) | Olaydan sonra en geç 24 saat içinde | Bağlı yönetici ve iş güvenliği uzmanı |
| **İş kazası:** bir çalışan yaralandı veya sağlığı bozuldu | Kesik, ezilme, düşme sonucu yaralanma, yanık, elektrik çarpması | İş Kazası Bildirim ve Araştırma Formu ({{no:kaza}}) | Hemen sözlü; form en geç 24 saat içinde | Bağlı yönetici, iş güvenliği uzmanı, işyeri hekimi, İnsan Kaynakları |

- Yaralanma olmadan yalnız makine, araç veya malzeme hasarı oluşan olaylar da Ramak Kala Olay Bildirim Formu ile bildirilir; formda “Yalnız maddi hasar oluştu” seçeneği işaretlenir.
- İş kazası, işveren tarafından kazadan sonraki **en geç 3 iş günü** içinde SGK'ya bildirilir (6331 sayılı Kanun md. 14, 5510 sayılı Kanun md. 13). Şirket içi form yasal bildirimin yerine geçmez.
- Meslek hastalığı şüphesi işyeri hekimine iletilir. Meslek hastalığı, öğrenildiği tarihten itibaren 3 iş günü içinde SGK'ya bildirilir.
- Bildirimler iş güvenliği uzmanı tarafından kayda alınır ve incelenir; alınan önlemler bildirimde bulunana iletilir.

// 24 saat ve “aynı vardiya” süreleri şirket kuralıdır; uygulamanıza göre değiştirebilirsiniz. Yasal süre olan 3 iş günü değiştirilemez.
`],
['İş Kazası Anında Yapılacaklar',`
1. **Kendi güvenliğinizi sağlayın.** Tehlike sürüyorsa makineyi durdurun, enerjiyi kesin; kendinizi riske atmayın.
2. **112'yi arayın.** Yaralının durumunu ve adresi net verin: {{adres}}
3. **İlk yardımcıyı çağırın** ({{ilkyardimci}}). İlk yardım eğitimi almamış kişiler yaralıyı hareket ettirmez, yalnız güvenli ortamı sağlar.
4. **Yöneticinize ve iş güvenliği uzmanına haber verin** ({{isg_uzmani}}). İç acil durum hattı: {{acil_tel_ic}}
5. **Olay yerini koruyun.** İnceleme tamamlanana kadar ekipman ve malzemelerin yerini değiştirmeyin; mümkünse fotoğraf çekin.
6. **Tanıkları not edin.** Olayı görenlerin adlarını kaydedin.
7. **Formu doldurun.** İş Kazası Bildirim ve Araştırma Formu ({{no:kaza}}) en geç 24 saat içinde doldurulur.
8. **Yasal bildirim.** İşveren kazayı kolluk kuvvetlerine derhal, SGK'ya kazadan sonraki en geç 3 iş günü içinde bildirir (5510 sayılı Kanun md. 13).

En yakın sağlık kuruluşu: **{{saglik_kurulusu}}**
`],
['Ciddi ve Yakın Tehlike: Çalışmaktan Kaçınma Hakkı',`
Ciddi ve yakın bir tehlikeyle karşılaşan çalışan, İSG kuruluna; kurul bulunmayan işyerlerinde işverene başvurarak durumun tespit edilmesini ve gerekli tedbirlerin alınmasını talep edebilir (6331 sayılı Kanun md. 13).
- Talebin uygun bulunması hâlinde gerekli tedbirler alınıncaya kadar çalışan çalışmaktan kaçınabilir. Bu sürede çalışanın ücreti ve diğer hakları saklıdır.
- Ciddi, yakın ve önlenemez tehlike durumunda çalışan, işyerini veya tehlikeli bölgeyi terk ederek güvenli bir yere gider. Bu nedenle çalışanın hakları kısıtlanamaz.
- Böyle bir durumu fark eden çalışan, Tehlikeli Durum Bildirim Formu ({{no:tehlike}}) ile kayıt da oluşturur.
`],
['Acil Durumlar',`
| Acil durum bilgisi | Değer |
|---|---|
| Acil çağrı | 112 |
| İç acil durum hattı | {{acil_tel_ic}} |
| Acil toplanma alanı | {{toplanma_yeri}} |
| En yakın sağlık kuruluşu | {{saglik_kurulusu}} |

## Yangın
- Yangını gördüğünüzde yüksek sesle uyarın, alarmı çalıştırın ve 112'yi arayın.
- Eğitim aldıysanız ve yangın başlangıç aşamasındaysa söndürücüyü kullanın: pimi çekin, hortumu ateşin dibine yöneltin, tetiğe basın, süpürür gibi hareket ettirin.
- Asansör kullanmayın; tahliye yollarını izleyerek toplanma alanına gidin.

## Deprem
- Sarsıntı sırasında koşmayın; sağlam bir eşyanın yanına çökün, başınızı ve boynunuzu koruyun, tutunun.
- Sarsıntı bittikten sonra binayı tahliye yollarından terk edin.
- Toplanma alanında yoklama verin; izin verilmeden binaya geri dönmeyin.

## Tahliye ve tatbikat
- Tahliye talimatı geldiğinde işinizi güvenli şekilde durdurup en yakın acil çıkışı kullanın.
- Acil durum tatbikatı yılda en az bir kez yapılır; tüm çalışanların katılımı zorunludur.
- Acil durum planı {{risk_periyodu}} yenilenir.
`],
['Eğitim, Sağlık Gözetimi ve Risk Değerlendirmesi',`
## İSG eğitimleri
- Her çalışana işe başlamadan önce temel İSG eğitimi verilir.
- İşyerimiz **{{tehlike_sinifi}}** sınıfta yer aldığından eğitimler **{{egitim_periyodu}}** tekrarlanır ve çalışan başına en az **{{egitim_suresi}} saat** olarak planlanır.
- İş kazası geçiren veya meslek hastalığına yakalanan çalışana işe dönmeden önce ek eğitim verilir.
- Herhangi bir nedenle altı aydan uzun süre işten uzak kalan çalışana işe dönmeden önce bilgi yenileme eğitimi verilir.
- Görev, ekipman veya teknoloji değişikliğinde ilgili eğitim tekrarlanır.

## Sağlık gözetimi
- İşe girişte ve iş değişikliğinde sağlık muayenesi yapılır.
- Periyodik muayeneler {{saglik_periyodu}} yapılır; işyeri hekimi gerekli gördüğünde bu süre kısaltılır.

## Risk değerlendirmesi
İşyerinin risk değerlendirmesi {{risk_periyodu}} yenilenir. İş kazası, meslek hastalığı, ramak kala olay veya işyerinde önemli bir değişiklik olduğunda süre beklenmeden güncellenir.
`],
['Yaptırımlar',`
- İSG kurallarına uymayan çalışan hakkında Personel El Kitabı'nda ({{no:elkitabi}}) belirtilen disiplin süreci uygulanır.
- Çalışanın kendi isteği veya ihmali nedeniyle iş güvenliğini tehlikeye düşürmesi, 4857 sayılı İş Kanunu'nun 25. maddesi uyarınca haklı fesih nedeni olabilir.
- Tehlikeli durum veya ramak kala bildiriminde bulunan çalışan, bildirimi nedeniyle hiçbir yaptırımla karşılaşmaz.
`],
['Yürürlük',`
Bu kurallar işveren onayıyla yürürlüğe girer ve tüm çalışanlara eğitimle duyurulur. Revizyonlar yeni belge numarasıyla yayımlanır; yürürlükteki sürüm, belge başlığındaki revizyon numarasıyla belirlenir.
`],
]),
mkDoc('tehlike','form','Tehlikeli Durum Bildirim Formu','FR-01',[
['Bu form ne zaman kullanılır?',`
**Henüz bir olay yaşanmadı ama yaşanabilir.** İşyerinde zarar verebilecek bir durum (güvensiz durum) ya da davranış (güvensiz davranış) gördüğünüzde bu formu doldurun.
- Örnek: kaygan ya da delik zemin, koruyucusu sökülmüş makine, açıkta elektrik kablosu, önü kapatılmış acil çıkış veya yangın söndürücü, KKD kullanmadan çalışma, hatalı istif.
- Önce bağlı yöneticinize sözlü haber verin; formu **aynı vardiya içinde** teslim edin.
- Ciddi ve yakın bir tehlike varsa işi durdurun, bölgeden uzaklaşın ve hemen haber verin.
- Bir olay yaşandıysa **Ramak Kala Olay Bildirim Formu ({{no:ramak}})**, yaralanma varsa **İş Kazası Bildirim ve Araştırma Formu ({{no:kaza}})** kullanılır.
- Bildirimde bulunan çalışan cezalandırılmaz. Adınızı yazmak isteğe bağlıdır.

function revHistHTML(d){

  return `<div class="tbl-wrap"><table class="tbl"><thead><tr><th>Rev.</th><th>Tarih</th><th>Değişiklik açıklaması</th><th>Hazırlayan</th><th>Onaylayan</th><th></th></tr></thead><tbody>${rows.join('')}</tbody></table></div>`;

function sectionDiffs(a,b){
  const am=new Map(a.sections.map(s=>[s.id,s]));let h='';
  b.sections.forEach((s,i)=>{const o=am.get(s.id);
    if(!o) h+=`<div class="sd"><div class="sd-t">Eklendi: ${i+1}. ${esc(s.title)}</div>${diffHTML(compactDiff(diffLines('',s.body),2))}</div>`;
    else if(o.body!==s.body) h+=`<div class="sd"><div class="sd-t">${i+1}. ${esc(s.title)}</div>${diffHTML(compactDiff(diffLines(o.body,s.body)))}</div>`;});
  const bm=new Set(b.sections.map(s=>s.id));
  a.sections.forEach(s=>{if(!bm.has(s.id)) h+=`<div class="sd"><div class="sd-t">Silindi: ${esc(s.title)}</div>${diffHTML(compactDiff(diffLines(s.body,''),2))}</div>`;});
  return h;
}
function revDiffHTML(d,i){
  const r=d.revisions[i],prev=i>0?d.revisions[i-1].snapshot:null;
  return `<ul class="chg">${(r.changes||[]).map(x=>`<li>${esc(x)}</li>`).join('')}</ul>${prev?sectionDiffs(prev,r.snapshot)||'':'<p class="muted small">İlk yayın; karşılaştırılacak önceki sürüm yok.</p>'}`;
}

function logListHTML(list,compact){

async function loadLogo(file){
  if(!file) return;
  if(!/^image\//.test(file.type)){toast('Lütfen bir görsel dosyası seçin.','err');return;}
  const url=URL.createObjectURL(file);
  try{
    const img=new Image();img.src=url;await img.decode();
    let w=img.naturalWidth||600,h=img.naturalHeight||300;
    const k=Math.min(1,600/Math.max(w,h));w=Math.max(1,Math.round(w*k));h=Math.max(1,Math.round(h*k));
    const cv=document.createElement('canvas');cv.width=w;cv.height=h;cv.getContext('2d').drawImage(img,0,0,w,h);
    let data=cv.toDataURL('image/png');
    if(data.length>350000) data=cv.toDataURL('image/webp',.9);
    const had=!!C.logo;C.logo=data;
    addLog(C,{act:'logo',text:had?'Şirket logosu değiştirildi':'Şirket logosu eklendi',note:file.name});
    persist();render();toast('Logo kaydedildi.');
  }catch{toast('Görsel okunamadı. PNG veya JPG deneyin.','err');}
  finally{URL.revokeObjectURL(url);}
}

}
async function saveEdit(){
  const d=C.docs.find(x=>x.id===editing.docId);if(!d){editing=null;render();return;}
  const title=editing.title.trim()||'Başlıksız bölüm',body=editing.body.replace(/\s+$/,'');
  if(editing.sid===null){
    if(!body&&title==='Yeni bölüm'){editing=null;render();return;}
    if(!(await ensureUser())) return;
    const s={id:uid(),title,body};d.sections.push(s);touch(d);
    addLog(C,{act:'bolum-ekle',doc:d.id,docTitle:d.title,text:`Bölüm eklendi: ${d.sections.length}. ${title}`,diff:body?compactDiff(diffLines('',body),3):null});
  }else{
    const s=d.sections.find(x=>x.id===editing.sid);if(!s){editing=null;render();return;}
    if(s.title===title&&s.body===body){editing=null;render();return;}
    if(!(await ensureUser())) return;
    const i=d.sections.indexOf(s);
    addLog(C,{act:'bolum',doc:d.id,docTitle:d.title,text:`${i+1}. ${title} bölümü düzenlendi`,note:s.title!==title?`Başlık: “${s.title}” → “${title}”`:'',diff:s.body!==body?compactDiff(diffLines(s.body,body)):null});
    s.title=title;s.body=body;touch(d);
  }
  editing=null;persist();render();toast('Kaydedildi. Değişiklik kayda geçti.');
}
async function moveSec(sid,dir){
  const d=curDoc(),i=d.sections.findIndex(s=>s.id===sid),j=i+dir;
  if(i<0||j<0||j>=d.sections.length) return;
  if(!(await ensureUser())) return;
  const [s]=d.sections.splice(i,1);d.sections.splice(j,0,s);touch(d);
  addLog(C,{act:'sira',doc:d.id,docTitle:d.title,text:`“${s.title}” bölümü ${dir<0?'yukarı':'aşağı'} taşındı (${i+1}. → ${j+1}. sıra)`});
  persist();render();
}
async function delSec(sid){
  const d=curDoc(),s=d.sections.find(x=>x.id===sid);if(!s) return;
  const ok=await confirmDlg('Bölüm silinsin mi?',`“${s.title}” bölümü silinir. Silinen metin değişiklik kaydında saklanır; revizyon yayınlanana kadar taslağı geri alabilirsiniz.`,'Bölümü sil',true);
  if(!ok) return;
  if(!(await ensureUser())) return;
  const i=d.sections.indexOf(s);d.sections.splice(i,1);touch(d);
  addLog(C,{act:'bolum-sil',doc:d.id,docTitle:d.title,text:`Bölüm silindi: ${i+1}. ${s.title}`,diff:s.body?compactDiff(diffLines(s.body,''),3):null});
  persist();render();
}
const SNIP={
  bold:['**','**','kalın metin'],h:'## Ara başlık',ul:'- Madde',ol:'1. Madde',table:'| Başlık 1 | Başlık 2 |\n|---|---|\n| Hücre | Hücre |',note:'> Not metni',prep:'// Hazırlık notu (yazdırılmaz)',
  alan:'[alan] Etiket',uzun:'[uzun] Etiket',secim:'[secim] Soru: Seçenek 1 | Seçenek 2',kutu:'[kutu] Kontrol maddesi',imza:'[imza] Unvan',
};
function insertSnip(key,raw){
  const ta=$('#edBody');if(!ta) return;
  const sn=raw!==undefined?raw:SNIP[key];
  const s=ta.selectionStart,e=ta.selectionEnd,v=ta.value;
  let nv,a,b;
  if(Array.isArray(sn)){const sel=v.slice(s,e)||sn[2];nv=v.slice(0,s)+sn[0]+sel+sn[1]+v.slice(e);a=s+sn[0].length;b=a+sel.length;}
  else if(raw!==undefined){nv=v.slice(0,s)+sn+v.slice(e);a=b=s+sn.length;}
  else{const pre=v.slice(0,s),nl=pre&&!pre.endsWith('\n')?'\n':'',post=v.slice(e),nl2=post&&!post.startsWith('\n')?'\n':'';nv=pre+nl+sn+nl2+post;a=pre.length+nl.length;b=a+sn.length;}
  ta.value=nv;editing.body=nv;ta.focus();ta.setSelectionRange(a,b);ta._prev&&ta._prev();
}

/* ---------- Yazdırma ---------- */
function setPageStyle(footer,numbers=true){
  const q=s=>'"'+String(s).replace(/\\/g,'\\\\').replace(/"/g,'\\"').replace(/[\n\r]/g,' ')+'"';
  $('#pageStyle').textContent=`@page{size:A4;margin:12mm 13mm 15mm;@bottom-left{content:${q(footer)};font:8pt Arial,sans-serif;color:#555}${numbers?'@bottom-right{content:"Sayfa " counter(page) " / " counter(pages);font:8pt Arial,sans-serif;color:#555}':''}}`;
}
async function doPrint(html,footer,numbers){
  const el=$('#print');el.innerHTML=html;setPageStyle(footer,numbers);
  await Promise.all($$('img',el).map(i=>i.decode?i.decode().catch(()=>{}):0));
  window.print();
}
function printDoc(d,revIdx=null){
  const m=headMeta(d,revIdx);
  doPrint(docPrintHTML(d,revIdx,{watermark:true}),`${coName(C)} · ${m.no} · Rev.${m.rev}`);
}
function fillPrintForRoute(){
  const r=route();
  if(!C) return;
  if(r.v==='belge'&&curDoc()){const d=curDoc(),m=headMeta(d);$('#print').innerHTML=docPrintHTML(d,null,{watermark:true});setPageStyle(`${coName(C)} · ${m.no} · Rev.${m.rev}`);}
  else if(r.v==='rehber'){$('#print').innerHTML=posterHTML();setPageStyle(coName(C)+' · İSG Bildirim Rehberi',false);}
  else if(r.v==='genel'){$('#print').innerHTML=printAllHTML();setPageStyle(coName(C)+' · Şirket Yönetmeliği');}
  else{$('#print').innerHTML=`<div class="plain">${$('#main').innerHTML}</div>`;setPageStyle(coName(C));}
}
window.addEventListener('beforeprint',()=>{if(!$('#print').innerHTML.trim()) fillPrintForRoute();});
window.addEventListener('afterprint',()=>{$('#print').innerHTML='';});

/* ---------- Yedek ve dışa aktarma ---------- */
function download(data,name,type){
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([data],{type}));a.download=name;
  document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},1000);
}
function exportBackup(){
  if(!C){toast('Önce bir şirket ekleyin.');return;}
  C.lastBackup=nowISO();persist();
  download(JSON.stringify({app:FILE_APP,format:1,exportedAt:nowISO(),company:C},null,1),`KurumKitabi_${slug(coName(C))}_${dayInput()}.json`,'application/json');
  renderSide();toast('Yedek indirildi. Dosyayı güvenli bir yerde saklayın.');
}
async function importBackup(file){
  if(!file) return;
  let o;try{o=JSON.parse(await file.text());}catch{toast('Dosya okunamadı. Geçerli bir Kurum Kitabı yedeği seçin.','err');return;}
  const c=o&&o.app===FILE_APP&&o.company&&typeof o.company==='object'?o.company:null;
  if(!c||!Array.isArray(c.docs)||!c.info){toast('Bu dosya bir Kurum Kitabı yedeği değil.','err');return;}
  sanitizeCompany(c);
  if(meta.list.some(x=>x.id===c.id)){
    const r=await dlg(`<form method="dialog"><h2>Bu şirket zaten kayıtlı</h2><p>“${esc(coName(c))}” bu tarayıcıda zaten var. Yedek mevcut kaydın üzerine mi yazılsın, ayrı bir kopya olarak mı eklensin?</p><div class="dlg-foot"><button class="btn" value="cancel" formnovalidate>Vazgeç</button><button class="btn" value="copy">Kopya olarak ekle</button><button class="btn danger" value="over">Üzerine yaz</button></div></form>`);
    if(!r) return;
    if(r.v==='copy'){c.id=uid();c.info.kisa_ad=coName(c)+' (kopya)';}
  }else await closeDlg();
  addLog(c,{act:'yedek',text:'Yedekten yüklendi',note:`Dosya: ${file.name}`});
  C=c;meta.active=c.id;editing=null;persist();go('genel');toast('Yedek yüklendi.');
}
function backupDlg(){
  dlg(`<div class="dlg-in"><h2>Yedek</h2><p class="muted">Kurum Kitabı verileri yalnız bu tarayıcıda saklanır. Tarayıcı verileri silinirse belgeler de silinir. Düzenli yedek alın; yedeği başka bir bilgisayarda “Yedek yükle” ile açabilirsiniz.</p>
  ${C?`<div class="bk-row"><div><b>Yedek indir</b><br><span class="muted small">${esc(coName(C))} · son yedek: ${C.lastBackup?fmtDT(C.lastBackup):'alınmadı'}</span></div><button class="btn primary" data-act="export">İndir</button></div>`:''}
  <div class="bk-row"><div><b>Yedek yükle</b><br><span class="muted small">Daha önce indirilen .json dosyası</span></div><button class="btn" data-act="import">Dosya seç</button></div>
  <div class="dlg-foot"><button class="btn" data-act="dlg-close">Kapat</button></div></div>`);
}
function exportCSV(){
  const cell=x=>{let s=String(x??'');if(/^[=+\-@\t\r]/.test(s)) s="'"+s;return '"'+s.replace(/"/g,'""')+'"';};
  const rows=[['Tarih','Saat','Düzenleyen','Belge','İşlem','Açıklama','Ayrıntı']];
  for(const e of sortedLog()) rows.push([fmtD(e.ts),fmtT(e.ts),e.user,e.docTitle,ACT_LABEL[e.act]||e.act,e.text,[e.note,...(e.list||[]),diffText(e.diff)].filter(Boolean).join(' | ')]);
  download('\ufeff'+rows.map(r=>r.map(cell).join(';')).join('\r\n'),`KurumKitabi_DegisiklikKaydi_${slug(coName(C))}_${dayInput()}.csv`,'text/csv;charset=utf-8');
}
function helpDlg(){
  const R=[['## Ara başlık','Ara başlık'],['- Madde','Madde işaretli liste'],['1. Madde','Numaralı liste'],['**kalın**','<b>kalın</b>'],['> Not','Renkli not kutusu'],['// Not','Hazırlık notu (yalnız ekranda, yazdırılmaz)'],['| A | B |','Tablo (ilk satır başlık)'],['{{isg_uzmani}}','Şirket bilgisi, kendiliğinden dolar'],['{{no:kaza}}','Başka bir belgenin numarası'],['[alan] Etiket','Form: kısa yazı alanı (ikişer yan yana)'],['[uzun] Etiket','Form: geniş yazı alanı'],['[secim] Soru: A | B','Form: işaret kutuları'],['[kutu] Madde','Form: tek işaret kutusu'],['[imza] Unvan','Form: imza alanı (üçer yan yana)']];
  dlg(`<div class="dlg-in"><h2>Biçim rehberi</h2><div class="tbl-wrap"><table class="tbl"><thead><tr><th>Yazdığınız</th><th>Görünen</th></tr></thead><tbody>${R.map(([a,b])=>`<tr><td><code>${esc(a)}</code></td><td>${b}</td></tr>`).join('')}</tbody></table></div><p class="muted small">Boş satır yeni paragraf başlatır. Ctrl+S kaydeder, Ctrl+B seçili metni kalın yapar.</p><div class="dlg-foot"><button class="btn primary" data-act="dlg-close">Tamam</button></div></div>`);
}

/* ---------- Olaylar ---------- */
const ACT={
  'new-company':newCompany,sample:createSample,user:userDlg,backup:backupDlg,export:exportBackup,
  import:()=>$('#importFile').click(),'logo-pick':()=>$('#logoFile').click(),
  'logo-del':async()=>{if(!(await confirmDlg('Logo kaldırılsın mı?','Logo belgelerin başlığından kaldırılır.','Kaldır',true))) return;C.logo='';addLog(C,{act:'logo',text:'Şirket logosu kaldırıldı'});persist();render();},
  'company-del':deleteCompany,'new-doc':newDoc,
  'doc-settings':()=>docSettings(curDoc()),publish:()=>publishDlg(curDoc()),'publish-all':publishAll,revert:()=>revertDoc(curDoc()),
  'print-doc':()=>printDoc(curDoc()),
  'print-all':()=>doPrint(printAllHTML(),coName(C)+' · Şirket Yönetmeliği'),
  'print-poster':()=>doPrint(posterHTML(),coName(C)+' · İSG Bildirim Rehberi',false),
  'sec-edit':b=>startEdit(b.closest('[data-sid]').dataset.sid),'sec-add':()=>startEdit(null),
  'sec-up':b=>moveSec(b.closest('[data-sid]').dataset.sid,-1),'sec-down':b=>moveSec(b.closest('[data-sid]').dataset.sid,1),
  'sec-del':b=>delSec(b.closest('[data-sid]').dataset.sid),
  'sec-save':saveEdit,'sec-cancel':()=>{editing=null;render();},
  ins:b=>insertSnip(b.dataset.snip),help:helpDlg,'dlg-close':closeDlg,
  'rev-diff':b=>{const i=+b.dataset.i,row=$('#revx-'+i);if(!row) return;if(row.hidden){row.firstElementChild.innerHTML=revDiffHTML(curDoc(),i);row.hidden=false;b.textContent='Gizle';}else{row.hidden=true;b.textContent='Farklar';}},
  'rev-view':b=>{const d=curDoc(),i=+b.dataset.i,r=d.revisions[i],cx=mkCtx(C,{info:r.snapshot.info});
    dlg(`<div class="dlg-in"><div class="dlg-top"><h2>${esc(r.snapshot.title)} · Rev.${revStr(r.rev)}</h2><div class="actions"><button class="btn" data-act="print-rev" data-i="${i}">Bu sürümü yazdır</button><button class="btn" data-act="dlg-close">Kapat</button></div></div><p class="muted small">${fmtD(r.date)} tarihinde yayınlanan sürüm. Şirket bilgileri o günkü değerleriyle gösterilir.</p><div class="paper ${d.kind}">${docHeadHTML(headMeta(d,i))}${r.snapshot.sections.map((s,k)=>roSecHTML(d.kind,s,k,cx)).join('')}</div></div>`,true);},
  'print-rev':async b=>{const d=curDoc(),i=+b.dataset.i;await closeDlg();printDoc(d,i);},
  wiz:b=>{if(b.dataset.v==='1') wz.res=WQ[wz.step].yes; else if(wz.step<2) wz.step++; else wz.res='yok';$('#wiz').innerHTML=wizHTML();},
  'wiz-reset':()=>{wz={step:0,res:null};$('#wiz').innerHTML=wizHTML();},
  csv:exportCSV,
};
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]');if(!b||b.disabled) return;
  const f=ACT[b.dataset.act];if(!f) return;
  e.preventDefault();f(b,e);
});
document.addEventListener('dblclick',e=>{
  const s=e.target.closest('.sec[data-sid]');
  if(s&&!e.target.closest('.sec-tools')&&!editing) startEdit(s.dataset.sid);
});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.dataset.field){onFieldChange(t);return;}
  if(t.id==='logoFile'){loadLogo(t.files[0]);t.value='';return;}
  if(t.id==='importFile'){importBackup(t.files[0]);t.value='';return;}
  const k=t.dataset.change;
  if(k==='company') switchCompany(t.value);
  else if(k==='log-doc'){lf.doc=t.value;$('#logList').innerHTML=logListHTML(filteredLog());}
  else if(k==='ins-ph'&&t.value){insertSnip(null,`{{${t.value}}}`);t.value='';}
  else if(k==='ins-field'&&t.value){insertSnip(t.value);t.value='';}
  else if(k==='tpl-pick'){
    const o=t.selectedOptions[0],f=t.form,tp=t.value?makeDocs().find(x=>x.role===t.value):null;
    f.title.value=tp?o.dataset.title:'';f.code.value=tp?o.dataset.code:'';
    if(tp) f.kind.value=tp.kind;
    f.kind.disabled=!!tp;
  }
});
document.addEventListener('input',e=>{
  const t=e.target;
  if(t.id==='edBody'&&editing){editing.body=t.value;t._prev&&t._prev();}
  else if(t.id==='edTitle'&&editing){editing.title=t.value;}
  else if(t.dataset.input==='log-q'){lf.q=t.value;$('#logList').innerHTML=logListHTML(filteredLog());}
});
document.addEventListener('keydown',e=>{
  if(!editing||$('#dlg').open) return;
  if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='s'){e.preventDefault();saveEdit();}
  else if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='b'&&e.target.id==='edBody'){e.preventDefault();insertSnip('bold');}
});
window.addEventListener('beforeunload',e=>{if(edChanged()){e.preventDefault();e.returnValue='';}});
window.addEventListener('hashchange',()=>{render();window.scrollTo(0,0);});

/* ---------- Başlangıç ---------- */
loadActive();
if(navigator.storage&&navigator.storage.persist) navigator.storage.persist().catch(()=>{});
render();
})();
</script>
